<section class="dropdown">
  <button type="button" class="dropdown__header" (click)="toggle()">
    <span>Deposit Schemes</span>
    <span class="dropdown__arrow" [class.dropdown__arrow--open]="isOpen()">▾</span>
  </button>

  @if (isOpen()) {
    <div class="amount-bar">
      <label for="globalDepositAmount">Deposit Amount</label>
      <div class="amount-bar__input">
        <span class="amount-bar__prefix">₹</span>
        <input
          id="globalDepositAmount"
          type="number"
          [min]="minDepositAmount"
          step="500"
          [ngModel]="depositAmount()"
          (ngModelChange)="onDepositAmountChange($event)"
        />
      </div>
      <p class="amount-bar__hint">
        Every chart below recalculates for this amount. A few schemes (recurring deposits, Bala
        Bhavishyath) cap it to their own installment range.
      </p>
    </div>

    <div class="scheme-grid">
      @for (scheme of schemes; track scheme.id) {
        <app-scheme-card [scheme]="scheme" [globalAmount]="depositAmount()"></app-scheme-card>
      }
    </div>

    <div class="bala-section">
      <app-bala-bhavishyath-card [globalAmount]="depositAmount()"></app-bala-bhavishyath-card>
    </div>
  }
</section>
